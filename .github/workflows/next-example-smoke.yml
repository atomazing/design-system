name: Next Example Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/next-example-smoke.yml"
      - "examples/next-app-router/**"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "README.MD"
  push:
    branches: ["master", "main"]
    paths:
      - ".github/workflows/next-example-smoke.yml"
      - "examples/next-app-router/**"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "README.MD"

jobs:
  smoke-next-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.14.4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next example smoke
        run: pnpm run smoke:next
